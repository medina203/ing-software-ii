services:
  postgres:
    image: postgres:16-alpine
    container_name: inventario-construccion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventario123}
      POSTGRES_DB: ${POSTGRES_DB:-inventario_db}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inventario_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventario} -d ${POSTGRES_DB:-inventario_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  inventario_postgres_data:
    name: inventario_constructora_postgres_data
